# 小方块任务专用超参（基于官方 hyp.scratch-low.yaml 修改）
# 关键改动：关掉左右/上下翻转 —— 类别只能靠面上的中文字区分，镜像文字会毁掉分类学习
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.75          # 类别损失权重加大(默认0.5): 这个任务分类是难点
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.010       # 灰度场景，色相扰动收小
hsv_s: 0.30
hsv_v: 0.40
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0        # 关: 上下镜像毁文字
fliplr: 0.0        # 关: 左右镜像毁文字(默认0.5, 是P卡在1/3的头号嫌疑)
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
