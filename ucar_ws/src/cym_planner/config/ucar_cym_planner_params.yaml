cym_planner/CymPlanner:
  # Keep the real-vehicle frame and filtered lidar chain.
  base_link_frame: base_link
  scan_topic: /scan_filtered
  scan_timeout: 0.4
  scan_min_range: 0.03
  scan_max_range: 3.0

  # Use the current simulation controller on the vehicle: origin/main path
  # following guarded by direct lidar points swept over the full footprint.
  navigation_mode: laser_avoidance
  main_legacy_target_distance: 0.20
  main_legacy_linear_x_gain: 1.5
  main_legacy_linear_x_kd: 0.05
  main_legacy_angular_gain: 2.5

  # Preserve the proven real-vehicle limits instead of the simulation's
  # high-speed Gazebo values.
  main_legacy_max_vel_x: 0.5
  main_legacy_max_vel_theta: 1.0
  main_legacy_final_yaw_gain: 2.0
  main_legacy_final_yaw_max_vel: 1.0
  main_legacy_final_yaw_tolerance: 0.10
  main_legacy_final_linear_x_gain: 1.0
  main_legacy_goal_position_tolerance: 0.05
  carry_speed_scale: 1.0

  # Project the 0.342 m x 0.256 m costmap footprint every 0.03 m over the
  # next 0.30 m of the global path. Any filtered lidar touch fails closed and
  # asks move_base/global_planner for a new route.
  main_legacy_obstacle_lookahead_distance: 0.30
  main_legacy_obstacle_cost_threshold: 253
  laser_projection_step: 0.03
  safety_margin: 0.035

  # Retained by the imported simulation implementation for its bounded-stop
  # and diagnostic helpers.
  braking_deceleration: 3.0
  minimum_moving_clearance: 0.10
  laser_blocked_grace_period: 0.25
  laser_blocked_hold_max_velocity: 0.10
  laser_blocked_stop_deceleration: 0.25
  laser_blocked_stop_angular_deceleration: 1.0
  laser_command_linear_rate_limit: 0.50
  laser_command_angular_rate_limit: 4.0
  reaction_time: 0.05
  simulation_time: 0.30
  simulation_step: 0.05
  v_samples: 7
  w_samples: 9
  path_distance_weight: 4.0
  heading_weight: 0.8
  clearance_weight: 0.5
  velocity_weight: 0.5
  angular_velocity_weight: 0.05
  minimum_progress_velocity: 0.05
  minimum_turn_velocity: 0.10
