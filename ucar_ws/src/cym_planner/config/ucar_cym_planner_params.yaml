cym_planner/CymPlanner:
  # 真机局部控制直接使用离群点过滤后的激光数据。
  base_link_frame: base_link
  scan_topic: /scan_filtered
  scan_timeout: 0.4
  scan_min_range: 0.03
  scan_max_range: 3.0

  # 使用真实车体 footprint 外扩 3.5 cm 做激光轨迹扫掠。
  safety_margin: 0.035
  braking_deceleration: 3.0
  reaction_time: 0.05

  # 路径跟踪保持真机安全速度；不采用开发环境中的高速参数。
  lookahead_distance: 0.5
  linear_x_gain: 1.5
  angular_gain: 2.5
  max_vel_x: 0.5
  max_vel_theta: 1.0

  # 终点位置与朝向控制。
  goal_position_tolerance: 0.05
  final_yaw_gain: 2.0
  final_yaw_max_vel: 1.0
  final_yaw_tolerance: 0.10
  final_linear_x_gain: 1.0
  carry_speed_scale: 1.0

  # 直接激光轨迹采样与评分。
  simulation_time: 0.3
  simulation_step: 0.05
  v_samples: 7
  w_samples: 9
  path_distance_weight: 4.0
  heading_weight: 0.8
  clearance_weight: 0.5
  velocity_weight: 0.5
  angular_velocity_weight: 0.05
  minimum_progress_velocity: 0.05
  minimum_turn_velocity: 0.10

  # 代价地图仅用于辅助触发全局重规划。
  obstacle_lookahead_distance: 0.30
  obstacle_cost_threshold: 253
