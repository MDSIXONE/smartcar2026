global_costmap:
   global_frame: map
   robot_base_frame: base_link
   update_frequency: 5
   publish_frequency: 5
   #static_map: true
   rolling_window: false
   resolution: 0.01
   transform_tolerance: 2
   #map_type: costmap
   plugins:
           - {name: static_layer,       type: "costmap_2d::StaticLayer"}
           - {name: inflation_layer,    type: "costmap_2d::InflationLayer"}
   cost_scaling_factor: 25 #80 #60.0  # exponential rate at which the obstacle cost drops off (default: 10)
   inflation_radius:     0.25 #0.2 # max. distance from an obstacle at which costs are incurred for planning paths.

GlobalPlanner:        
   allow_unknown:  true
