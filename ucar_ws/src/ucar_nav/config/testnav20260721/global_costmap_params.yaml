global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 3.0
  # GlobalPlanner reads the in-process Costmap2D. CymPlanner now projects only
  # into a local snapshot, so full OccupancyGrid publication is not a safety
  # dependency and can remain incremental when RViz is not used.
  publish_frequency: 5.0
  static_map: true
  rolling_window: false
  resolution: 0.01185
  always_send_full_costmap: false
  track_unknown_space: false
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
