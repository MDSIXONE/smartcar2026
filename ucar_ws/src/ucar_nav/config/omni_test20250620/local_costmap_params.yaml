local_costmap:
   # Keep the real vehicle's localization and sensor frames.  The footprint
   # matches the global costmap so global and local collision checks agree.
   global_frame: map
   robot_base_frame: base_link
   update_frequency: 12.0
   publish_frequency: 5.0
   rolling_window: true
   width: 5.0
   height: 5.0
   resolution: 0.03
   footprint: [[0.171, -0.128], [0.171, 0.128], [-0.171, 0.128], [-0.171, -0.128]]
   footprint_padding: 0.0
   transform_tolerance: 0.30
   always_send_full_costmap: true
   plugins:
      - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
      - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
   obstacle_layer:
      enabled: true
      combination_method: 1
      track_unknown_space: false
      obstacle_range: 3.0
      raytrace_range: 4.0
      observation_sources: laser_scan_sensor
      laser_scan_sensor:
         # Keep the real vehicle's isolated-return filter; localization keeps
         # consuming raw /scan and the simulation-equivalent tuning begins here.
         sensor_frame: laser_frame
         data_type: LaserScan
         topic: /scan_filtered
         marking: true
         clearing: true
         inf_is_valid: true
         observation_persistence: 0.0
   inflation_layer:
      enabled: true
      inflation_radius: 0.07
      cost_scaling_factor: 4.0
