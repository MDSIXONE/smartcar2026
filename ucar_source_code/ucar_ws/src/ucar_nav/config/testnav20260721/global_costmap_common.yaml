# testnav20260721 global costmap.  Keep the real vehicle footprint/frames and
# Keep the normal recovery start radius aligned with local costmap at 0.224 m.
footprint: [[0.171, -0.128], [0.171, 0.128], [-0.171, 0.128], [-0.171, -0.128]]
footprint_padding: 0.0
transform_tolerance: 0.5

static_layer:
  enabled: true
  map_topic: /map
  subscribe_to_updates: true

obstacle_layer:
  enabled: true
  combination_method: 1
  track_unknown_space: false
  obstacle_range: 3.0
  raytrace_range: 4.0
  observation_sources: global_scan_sensor
  global_scan_sensor:
    sensor_frame: laser_frame
    data_type: LaserScan
    topic: /scan_global_obstacles
    marking: true
    clearing: true
    inf_is_valid: true
    observation_persistence: 0.0
    min_obstacle_height: 0.0
    max_obstacle_height: 0.30

inflation_layer:
  enabled: true
  inflation_radius: 0.224
  cost_scaling_factor: 0.05
