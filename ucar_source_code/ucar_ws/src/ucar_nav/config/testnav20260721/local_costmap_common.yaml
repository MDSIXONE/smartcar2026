# testnav20260721 local obstacle/inflation tuning.
footprint: [[0.171, -0.128], [0.171, 0.128], [-0.171, 0.128], [-0.171, -0.128]]
footprint_padding: 0.0
transform_tolerance: 0.3

static_layer:
  enabled: true
  map_topic: /map
  subscribe_to_updates: true

obstacle_layer:
  enabled: true
  combination_method: 1
  track_unknown_space: false
  obstacle_range: 3.0
  raytrace_range: 4.0
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: laser_frame
    data_type: LaserScan
    topic: /scan_filtered
    marking: true
    clearing: true
    inf_is_valid: true
    # Fail local_costmap::isCurrent() if filtered scans stop arriving.
    expected_update_rate: 0.30
    observation_persistence: 0.0

inflation_layer:
  enabled: true
  inflation_radius: 0.235
  cost_scaling_factor: 4.0
