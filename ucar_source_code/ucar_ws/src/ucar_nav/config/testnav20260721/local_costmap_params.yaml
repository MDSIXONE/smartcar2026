local_costmap:
  # Keep map/base_link: lidar_loc map -> odom corrections otherwise leave
  # stale obstacle trails while the vehicle rotates in place.
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 8.0
  publish_frequency: 3.0
  # Rolling local window still includes the static /map walls. This keeps
  # footprint safety independent of a momentary lidar occlusion.
  static_map: true
  rolling_window: true
  # 1.8 m square gives the 0.8 m CymPlanner lookahead enough local context
  # to see the inflation band before the vehicle reaches it.
  width: 1.8
  height: 1.8
  resolution: 0.02
  always_send_full_costmap: true
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
