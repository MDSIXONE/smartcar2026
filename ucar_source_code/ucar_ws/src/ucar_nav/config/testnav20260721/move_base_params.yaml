shutdown_costmaps: false

controller_frequency: 20.0
controller_patience: 0.5
# 2026-08-11：3.0→5.0。中途障碍（如 431）出现时更快重规划绕行，
# 配合 CymPlanner 降速降低碰撞概率；频率仍远低于 controller 20Hz。
# 2026-08-15：5.0→0.0。关闭周期性全局重规划：一次规划后仅在
# CymPlanner 前视判障失败（controller_patience 内）时事件驱动重规划，
# 消除 5Hz 在近障碍处反复换侧导致的急转。
planner_frequency: 0.0
planner_patience: 3.0
oscillation_timeout: 5.0
oscillation_distance: 0.01

base_global_planner: "global_planner/GlobalPlanner"
base_local_planner: "cym_planner/CymPlanner"
max_planning_retries: 3

recovery_behavior_enabled: true
clearing_rotation_allowed: false
recovery_behaviors:
  - name: 'conservative_reset'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'aggressive_reset'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  # All standard recovery behaviors failed: lower local inflation by one
  # local grid (2cm) and global inflation by half a global grid per stage,
  # then return to PLANNING. The next stage is reached only when move_base
  # still cannot find a path.
  - name: 'relax_inflation_01'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_02'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_03'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_04'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_05'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_06'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_07'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_08'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_09'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_10'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_11'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_12'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_13'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_14'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_15'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_16'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_17'
    type: 'cym_planner/InflationRecovery'
  - name: 'relax_inflation_18'
    type: 'cym_planner/InflationRecovery'

inflation_recovery:
  local_service: /move_base/local_costmap/inflation_layer/set_parameters
  global_service: /move_base/global_costmap/inflation_layer/set_parameters
  local_reduction_step: 0.02
  global_reduction_step: 0.00395  # 1/3 of the 0.01185 m global grid
  minimum_radius: 0.05

relax_inflation_01: {stage: 1}
relax_inflation_02: {stage: 2}
relax_inflation_03: {stage: 3}
relax_inflation_04: {stage: 4}
relax_inflation_05: {stage: 5}
relax_inflation_06: {stage: 6}
relax_inflation_07: {stage: 7}
relax_inflation_08: {stage: 8}
relax_inflation_09: {stage: 9}
relax_inflation_10: {stage: 10}
relax_inflation_11: {stage: 11}
relax_inflation_12: {stage: 12}
relax_inflation_13: {stage: 13}
relax_inflation_14: {stage: 14}
relax_inflation_15: {stage: 15}
relax_inflation_16: {stage: 16}
relax_inflation_17: {stage: 17}
relax_inflation_18: {stage: 18}

conservative_reset:
  reset_distance: 1.0
  layer_names: [obstacle_layer]

aggressive_reset:
  reset_distance: 0.0
  layer_names: [obstacle_layer]

super_reset:
  reset_distance: 5.0
  layer_names: [obstacle_layer]

move_slow_and_clear:
  clearing_distance: 0.5
  limited_trans_speed: 0.1
  limited_rot_speed: 0.4
  limited_distance: 0.3
