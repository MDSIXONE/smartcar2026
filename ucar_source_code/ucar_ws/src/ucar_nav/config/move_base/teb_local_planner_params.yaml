TebLocalPlannerROS:

 odom_topic: odom                                  # 里程计话题消息
 #odom_topic: /robot_pose_ekf/odom_combined
 map_frame: odom                                   # 地图坐标系名称
 #map_frame: /odom_combined

 # Trajectory

 teb_autosize: True
 dt_ref: 0.3
 dt_hysteresis: 0.1
 max_samples: 500
 global_plan_overwrite_orientation: True
 allow_init_with_backwards_motion: True
 max_global_plan_lookahead_dist: 3.0
 global_plan_viapint_sep: -1
 global_plan_prune_distance: 1
 exact_arc_length: False
 feasibility_check_no_poses: 2
 publish_feedback: False

 # Robot

 max_vel_x: 1                                    # 机器人的最大 X 轴线速度
 max_vel_y: 1                                     # 机器人的最大 Y 轴线速度             差速导航注释掉此行
 max_vel_x_backwards: 0.5       # 机器人倒车的最大 X 轴线速度
 max_vel_theta: 2.0                            # 机器人最大旋转速度
 acc_lim_x: 0.5                                    # 机器人 X 轴最大线加速度
 acc_lim_y: 0.5                                   # 机器人 Y轴最大线加速度               差速导航注释掉此行
 acc_lim_theta: 1.0                            # 机器人最大旋转角加速度
 min_turning_radius: 0.0                   # 机器人最小转弯半径
 footprint_model: 
    types: "polygon"
    vertices: [[0.171, -0.128], [0.171, 0.128],[-0.171, 0.128], [-0.171, -0.128]]

 # GoalTolerance

 xy_goal_tolerance: 0.2
 yaw_goal_tolerance: 0.5
 free_goal_vel: False

 # Obstacles

 min_obstacle_dist: 0.05
 include_costmap_obstacles: True
 costmap_obstacles_behind_robot_dist: 1.0
 obstacle_poses_affected: 7
 costmap_converter_plugin: ""
 costmap_converter_spin_thread: True
 costmap_converter_rate: 5

 inflation_dist:  0.2 #0.6
 dynamic_obstacles_inflation_dist: 0.2 #0.6
 include_dynamic_obstacles: True

 # Optimization

 no_inner_iterations: 5
 no_outer_iterations: 4
 optimization_activate: True
 optimization_verbose: False
 penalty_epsilon: 0.1             #速度约束
 weight_max_vel_x: 1 #50
 weight_max_vel_y: 1                #差速导航注释掉此行
 weight_max_vel_theta: 1
 weight_acc_lim_x: 1
 weight_acc_lim_y: 1                #差速导航注释掉此行
 weight_acc_lim_theta: 1
 weight_kinematics_nh: 1            #差速导航将此值改为1000
 weight_kinematics_forward_drive: 1 #差速导航将此值改为60
 weight_kinematics_turning_radius: 1
 weight_optimaltime: 2.5 #1
 weight_shortest_path: 0
 weight_obstacle: 30
 weight_inflation: 0.1
 weight_dynamic_obstacle: 10 # not in use yet
 weight_dynamic_obstacle_inflation: 0.1
 weight_viapoint: 1
 weight_adapt_factor: 2
 selection_alternative_time_cost: False # not in use yet
obstacle_cost_exponent: 1

 # Homotopy Class Planner

#  enable_homotopy_class_planning: False
#  enable_multithreading: True
#  simple_exploration: False
#  max_number_classes: 4
#  roadmap_graph_no_samples: 15
