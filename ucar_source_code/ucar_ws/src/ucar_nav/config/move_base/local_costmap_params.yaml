#Description:
#  本地代价地图需要配置的参数，各参数意义如下:
#  global_frame:在本地代价地图中的全局坐标系;
#  robot_base_frame:机器人本体的基坐标系;

local_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 3.0  #5                        # 代价地图更新的频率(以 Hz 为单位)。根据传感器数据,全局地图更新的频率,这个数值越大,你的计算机的 CPU 负担会越重,
                                                                               # 特别对于全局地图,通常设定一个相对较小、在 1.0 到 5.0 之间的值。
  publish_frequency: 1.0 #3                        # 代价地图发布可视化信息的速率(以 Hz 为单位)。
  #static_map: false
  rolling_window: true                                  # 当机器人移动时,保持机器人在本地代价地图中心。
  width: 3.0                                                         # local_costmap 的宽度(m)
  height: 3.0                                                        # local_costmap 的长度/高度(m)
  resolution: 0.05                                              # local_costmap 的分辨率(米/单元格)
  transform_tolerance: 1.2 #10                   # 获取各坐标系 TF 变换超时时间

  #cost_scaling_factor:  10.0  # exponential rate at which the obstacle cost drops off (default: 10)
 # inflation_radius:     0.005 # max. distance from an obstacle at which costs are incurred for planning paths.

  plugins:                                                              # 添加所需要插入的 costmap 插件
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
