cym_planner/CymPlanner:
  base_link_frame: base_link
  odom_frame: odom
  # 无 RViz 时关闭调试图像；碰撞检查不依赖此开关。
  debug_images_enabled: false

  # 模式 1：point / main / main_legacy。
  # 保留原来的点碰撞阶段速度；heading_slowdown_min_scale=1 表示不因转角降速。
  # 2026-08-11：max_vel_x 0.50→0.35、max_vel_theta 1.00→0.80，
  #   final_yaw_tolerance 0.10→0.15 —— 降低绕行 431 类中途障碍时的碰撞
  #   概率/冲击；放宽到点朝向容差，省回部分降速时间。
  # 2026-08-15（用户试跑）：heading_slowdown_min_scale 1.00→0.00 —— 线速度
  #   按 cos²(航向误差) 缩放，换路后大角度对准先转向、基本不前进；
  #   final_linear_x_gain 1.0→0.0 —— 终点阶段只对准朝向，不做前后位置
  #   修正，消除墙边定点来回调整。
  # 2026-08-19：final_yaw_tolerance 0.05→0.10；普通点模式规划器内部位置包络 7cm，
  #   任务层到点验收与重试上限为 12cm。
  # 2026-08-19：国赛冲刺航向环 P 5.0→10.0；approach_decel_distance
  #   1.0→0.5m，延后减速起点以保持更高冲刺速度。
  # 2026-08-16（国赛 sprint 调参）：final_yaw_tolerance 0.15→0.05 ——
  #   到达点（含起点→70 的 180° 朝向）后朝向容差严格到 ±2.9°，
  #   保证冲刺出发时车头正对 y=1.75 走廊。
  mode1_point:
    linear_x_gain: 1.5
    linear_x_kd: 0.5
    max_vel_x: 0.35
    angular_gain: 2.5
    angular_kd: 0.4
    max_vel_theta: 0.80
    heading_slowdown_min_scale: 0.00
    goal_position_tolerance: 0.07
    command_sweep_time: 0.00
    command_sweep_step: 0.025
    final_yaw_gain: 2.0
    final_yaw_max_vel: 1.00
    final_yaw_tolerance: 0.10
    final_linear_x_gain: 0.0
    obstacle_lookahead_distance: 0.35
    # Any non-zero local cost means the path has entered an inflation band;
    # return false so move_base can request an event-driven global replan.
    obstacle_cost_threshold: 1
    carry_speed_scale: 1.0

  # 模式 2：body_projection / footprint / laser_avoidance。
  # 生产路线默认更慢；转角越大，线速度按 cos² 缩小，但不低于下方比例。
  # 常用调速入口：max_vel_x、max_vel_theta、heading_slowdown_min_scale。
  mode2_body_projection:
    linear_x_gain: 0.9
    linear_x_kd: 0.2
    max_vel_x: 0.07
    angular_gain: 2.0
    angular_kd: 0.2
    max_vel_theta: 0.35
    heading_slowdown_min_scale: 0.15
    # 按实际 (linear.x, linear.y, angular.z) 对未来 0.4 s 车体姿态做扫掠。
    command_sweep_time: 0.40
    command_sweep_step: 0.025
    final_yaw_gain: 1.5
    final_yaw_max_vel: 0.25
    final_yaw_tolerance: 0.10
    final_linear_x_gain: 0.6
    obstacle_lookahead_distance: 0.8
    # Treat every non-zero local inflation cost as a replan trigger.
    obstacle_cost_threshold: 1
    carry_speed_scale: 1.0

  # 模式 3：sprint —— 国赛"起点→52"途中 70→288 加速段专用参数集。
  # 点模式稳态速度 = 前视距离(0.20m) × linear_x_gain；2026-08-16 实车：
  # 先翻倍 max_vel_x（0.60→1.20）仍慢，根因是 gain 1.5 时稳态只有 ~0.3 m/s
  # （max_vel_x 只是上限，PD 输出顶不到）。把 linear_x_gain 提为 5.0，
  # 稳态 ≈1.0 m/s，接近 1.20 上限。其余保持点模式语义（终点只对朝向、
  # 无命令扫掠、保留前视判障）。需要更快/更慢只改本段 linear_x_gain 与
  # max_vel_x。任务节点在 70→288 段经 /ucar/navigation_mode 发布
  # "sprint" 切换，到达 288 后切回 "point"。
  # 2026-08-19：final_yaw_tolerance 0.05→0.10；规划器内部位置包络 8cm，
  #   任务层到点验收与重试上限为 12cm。
  # 2026-08-16：航向环 P 翻倍（angular_gain 2.5→5.0），直线段航向收敛
  #   更快，速度不因 cos² 缩放掉；final_yaw_tolerance 0.15→0.05，
  #   到达 288 时朝向同样严格（与 mode1_point 一致）。
  # 2026-08-16（第三轮）：航向环 P 再翻倍（angular_gain 5.0→10.0），
  #   角速度输出仍受 max_vel_theta 0.80 钳制，只加快小角度误差收敛。
  # 2026-08-18：按实车冲刺角度表现，航向环 P 10.0→5.0；线速度增益不变。
  # 2026-08-18：对比试跑，冲刺 max_vel_x 2.5→2.7；规划器无独立加速度
  #   参数，以 linear_x_gain 12.5→13.5 提高前向加速响应。
  # 2026-08-16（第五轮）：速度再次加大——linear_x_gain 5.0→8.0
  #   （稳态 0.20×8.0=1.6 m/s）、max_vel_x 1.20→1.60，稳态顶满上限；
  #   末端停车仍由 approach 自动减速兜底（1.0m 起压到 0.12）。
  # 2026-08-16（第六轮）：加到 2.0——linear_x_gain 8.0→10.0
  #   （稳态 0.20×10=2.0 m/s）、max_vel_x 1.60→2.0，稳态顶满 2.0；
  #   底盘裁剪上限 linear_speed_max 3.0 仍有余量。
  # 2026-08-16（第七轮）：速度加到 2.5——linear_x_gain 10.0→12.5
  #   （稳态 0.20×12.5=2.5 m/s）、max_vel_x 2.0→2.5；冲刺朝向实车
  #   偏一点，任务节点 sprint_yaw_deg 改为 175（见 2026.launch）。
  # 2026-08-16（第八轮）：快速上不去（2.5 m/s 高增益控制不稳），反向
  #   操作——PD 改回省赛（mode1_point）温和值（linear_x_gain 1.5、
  #   angular_gain 2.5、final_linear_x_gain 0.0），max_vel_x 取省赛
  #   0.35 的一半 0.175 试跑验证稳定性；approach 自动减速机制保留。
  # 2026-08-16（第九轮）：实车证明慢速麦轮上不了坡（0.175 无惯性冲坡），
  #   改回第七轮快速配置——linear_x_gain 12.5、max_vel_x 2.5、
  #   angular_gain 10.0、final_linear_x_gain 0.6（坡顶回拉兜底）；
  #   冲刺靠惯性冲坡，approach 自动减速（1.0m 起压到 0.12）在坡顶前刹停。
  # 2026-08-16（第四轮）：冲刺终点提前到坡顶中点 (0.875, 1.75)（由任务
  #   节点 sprint_end_x/y 指定），新增接近目标自动减速（approach_decel
  #   _distance 1.0 m 起速度上限线性压到 approach_min_vel_x 0.12），
  #   防止 1.0 m/s 冲刺惯性冲过坡顶刹不住；final_linear_x_gain 0.0→0.6
  #   允许终点阶段位置回拉修正（轻微冲过头时倒回）。
  # 2026-08-16（第十轮）：横向平移过坡实验——冲刺段改 transverse 模式，
  #   车头保持 90°（对齐路径终点朝向），横向误差×lateral_gain 驱动
  #   linear.y 沿 -x 方向横移过坡（麦轮底盘支持 linear.y）；
  #   max_vel_y 横向速度上限，与 max_vel_x 同量级；接近自动减速同样
  #   作用于横向速度。任务节点 sprint_transverse_enabled=true 时切换。
  mode3_sprint:
    linear_x_gain: 13.5
    linear_x_kd: 0.5
    max_vel_x: 2.7
    angular_gain: 10.0
    angular_kd: 0.4
    max_vel_theta: 0.80
    heading_slowdown_min_scale: 0.00
    command_sweep_time: 0.00
    command_sweep_step: 0.025
    # 接近目标自动减速：距终点 0.5m 起速度上限线性压到 0.12 m/s，
    # 延后减速以保持更高冲刺速度；final_linear_x_gain 0.6
    # 允许终点位置回拉修正（轻微冲过头时倒回）。
    approach_decel_distance: 0.5
    approach_min_vel_x: 0.12
    # 横向平移（transverse 模式）：横向误差×lateral_gain 驱动 linear.y，
    # 航向锁定路径终点朝向（90°）；max_vel_y 横向速度上限。
    lateral_gain: 12.5
    max_vel_y: 2.5
    final_yaw_gain: 2.0
    final_yaw_max_vel: 1.00
    final_yaw_tolerance: 0.10
    final_linear_x_gain: 0.6
    obstacle_lookahead_distance: 0.8
    # Treat every non-zero local inflation cost as a replan trigger.
    obstacle_cost_threshold: 1
    carry_speed_scale: 1.0

  # 模式 4：destination —— 仅用于生产任务到 441 的最后一段。
  # 普通路线继续使用 mode1_point；这里单独保留位置微调，并将规划器
  # 进入最终姿态阶段的距离收紧到 4cm，不改变任务层交接/结束语义。
  mode4_destination:
    final_linear_x_gain: 1.0
    goal_position_tolerance: 0.04

  # 受限横移目前是次级兜底。Sol 安全复核发现状态保持、全接触格统计和本地动态
  # 障碍检查仍需补齐，因此硬关闭；即使误改 true，当前源码也会拒绝并记录错误。
  escape_enabled: false
  escape_blocked_timeout: 0.4
  escape_replan_wait: 0.4
  escape_step_distance: 0.02
  escape_projection_step: 0.005
  escape_speed: 0.04
  escape_max_attempts: 4
  escape_max_total_distance: 0.08
  escape_heading_tolerance: 0.05

  # 局部 footprint 在前视路径进入高代价区前就开始选带；候选按完整轨迹的
  # 最差 footprint 代价、平均代价排序，选择净空最大的安全带。
  # 每一条带状候选都以 local 合并 costmap 的 254/255 和完整 footprint 验证；
  # 当前 footprint 接触、未知区、TF 或 costmap 异常仍直接失败关闭并请求全局重规划。
  elastic_enabled: true
  elastic_lookahead_distance: 0.25
  elastic_lateral_step: 0.02
  elastic_max_lateral_offset: 0.12
  elastic_validation_step: 0.015
  elastic_validation_yaw_step: 0.05
  elastic_max_vel_x: 0.07
  elastic_max_vel_theta: 0.30
  # >= 此 raw local cost 的前视 footprint 先尝试最大净空带；没有更低代价
  # 的带时立即让 move_base 用持续更新的 global costmap 重规划。
  elastic_activation_cost: 220
