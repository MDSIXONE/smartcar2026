# yolov4-tiny-tl7-640x352-w75.cfg
# 7 lei hong lv deng / 7-class traffic light, pruned
# 输入 640x352, 通道宽度 x0.75 -> 5.00 GFLOPs, 预计 ~857 ms
# (基线 640x352 x1.00 = 8.84 GFLOPs 实测 1516 ms, 即 171 ms/GFLOP,
#  这里是线性外推, 实际会比它慢一些)
# 你点名的这一档。保住 640x352 的分辨率(小目标友好), 但**到不了 500ms**
# ⚠ 通道数变了 -> 不能用 yolov4-tiny.conv.29 预训练权重, 只能从头训。
#   两个 head 前的 filters=36 = (7+5)*3 由类别数定死, 不参与缩放。

# yolov4-tiny-tl7-640x352.cfg -- 7 lei hong lv deng / 7-class traffic light
# classes: left right stop straight 'yellow left' 'yellow right' 'yellow straight'
# 由 yolov4-tiny-xf_724.cfg 改出: classes 6->7,
#   两个 head 前一层的 filters 33 -> 36 = (7+5)*3
# 输入 640x352
# max_batches 按 darknet 惯例取 max(类别数*2000, 6000) 上浮到 14000
# steps 取 80%/90%
# 训练时按显存调 batch/subdivisions; 推理用 batch=1 subdivisions=1

[net]
# Testing
batch=64
subdivisions=16
# Training
#batch=256
#subdivisions=16
width=640
height=352
channels=3
momentum=0.9
decay=0.0005
angle=0
saturation = 1.5
exposure = 1.5
hue=.1

# ⚠⚠ flip=0 —— 千万别删。
# darknet 的 [net] 默认 flip=1(水平翻转增强)。对这个数据集是**致命**的:
# 把 left 箭头的图左右一翻就变成了 right 箭头, 而标签还写着 left ——
# 等于给网络喂互相矛盾的监督。结果是 left/right 这一对直接塌成一类:
# 实测 640x352-w55 训到 3400 迭代, 训练集上 right 全部判成 left(25/25)、
# yellow left 全部判成 yellow right(25/25), 而 stop / straight /
# yellow straight 三类 100% 正确 —— 正好是"翻转后还是自己"的那三类。
flip=0

learning_rate=0.001
burn_in=64

max_batches = 14000
policy=steps
steps=11200,12600
scales=.1,.1


#weights_reject_freq=1001
#ema_alpha=0.9998
#equidistant_point=1000
#num_sigmas_reject_badlabels=3
#badlabels_rejection_percentage=0.2


